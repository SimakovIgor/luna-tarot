<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Luna — главный экран (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep:      #08050f;
    --bg-soft:      #110820;
    --ink:          #ede0c4;     /* основной текст — тёплое слоновое */
    --ink-dim:      #8a7c5e;     /* приглушённый */
    --ink-faint:    #4a3e2a;     /* едва видимый */
    --gold:         #c9a14a;     /* единственный акцент */
    --gold-warm:    #d9b876;
    --gold-deep:    #8a6a2f;
    --line:         rgba(201,161,74,.18);
    --line-hot:     rgba(201,161,74,.45);

    --font-display: "Cinzel", serif;
    --font-body:    "Cormorant Garamond", serif;
    --font-mark:    "UnifrakturMaguntia", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 20%, #1c0d33 0%, #0c0518 45%, var(--bg-deep) 100%);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    /* Grain: noise overlay */
    position: relative;
  }
  /* Грейн поверх всего */
  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0 0.6  0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: .35;
    mix-blend-mode: overlay;
    z-index: 100;
  }

  /* Контейнер экрана: имитируем iPhone 14 (390x844) центрируем для удобства */
  .device {
    width: min(100vw, 390px);
    min-height: 100vh;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 14px) 22px env(safe-area-inset-bottom, 18px);
    display: flex; flex-direction: column;
    position: relative;
    isolation: isolate;
  }

  /* ── Звёзды (фон) ─────────────────────────────────────────── */
  .stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .stars::before, .stars::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(255,236,200,.7) 0, transparent 50%),
      radial-gradient(1px 1px at 78% 22%, rgba(255,236,200,.5) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 35% 38%, rgba(255,236,200,.85) 0, transparent 50%),
      radial-gradient(1px 1px at 88% 55%, rgba(255,236,200,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 12% 70%, rgba(255,236,200,.6) 0, transparent 50%),
      radial-gradient(1px 1px at 64% 86%, rgba(255,236,200,.4) 0, transparent 50%),
      radial-gradient(1.2px 1.2px at 50% 50%, rgba(255,236,200,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 92% 12%, rgba(255,236,200,.5) 0, transparent 50%);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  .stars::after {
    background-image:
      radial-gradient(1px 1px at 8% 28%, rgba(255,236,200,.45) 0, transparent 50%),
      radial-gradient(1px 1px at 45% 8%, rgba(255,236,200,.55) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 70% 40%, rgba(255,236,200,.4) 0, transparent 50%),
      radial-gradient(1px 1px at 28% 60%, rgba(255,236,200,.5) 0, transparent 50%),
      radial-gradient(1px 1px at 82% 75%, rgba(255,236,200,.5) 0, transparent 50%);
    animation: twinkle 4s ease-in-out 1s infinite alternate;
    opacity: .8;
  }
  @keyframes twinkle {
    0%   { opacity: .25; }
    100% { opacity: .9; }
  }

  /* ── Шапка ────────────────────────────────────────────────── */
  .top {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: .22em;
    color: var(--ink-dim);
    text-transform: uppercase;
    padding-top: 6px;
  }
  .top .moon-phase {
    display: flex; align-items: center; gap: 8px;
  }
  .top .moon-phase .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f6e5b5 0%, var(--gold) 60%, transparent 100%);
    box-shadow: 0 0 8px rgba(201,161,74,.6);
  }

  /* ── Большая луна (главный hero сверху) ─────────────────── */
  .moon-stage {
    position: relative; z-index: 1;
    margin: 28px auto 8px;
    width: 168px; height: 168px;
    display: flex; align-items: center; justify-content: center;
  }
  .moon-aura {
    position: absolute; inset: -40px;
    background: radial-gradient(circle, rgba(201,161,74,.18) 0%, rgba(201,161,74,0) 60%);
    animation: aura 5s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes aura {
    0%   { transform: scale(.92); opacity: .55; }
    100% { transform: scale(1.08); opacity: .95; }
  }
  .moon {
    width: 120px; height: 120px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 32%, #fff4d1 0%, #f0d895 38%, #b8893a 72%, #5a4012 100%);
    box-shadow:
      inset -10px -14px 28px rgba(0,0,0,.55),
      inset 8px 10px 20px rgba(255,236,180,.18),
      0 0 60px rgba(201,161,74,.28);
    position: relative;
    animation: breath 6s ease-in-out infinite;
  }
  .moon::before, .moon::after {
    /* кратеры */
    content: ""; position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,0,0,.28), transparent 70%);
  }
  .moon::before { width: 18px; height: 18px; top: 28%; left: 30%; }
  .moon::after  { width: 12px; height: 12px; top: 56%; left: 52%; }
  @keyframes breath {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  /* орбита-кольцо */
  .moon-stage .orbit {
    position: absolute; inset: 6px;
    border: 1px dashed rgba(201,161,74,.35);
    border-radius: 50%;
    animation: spin 80s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ── Бренд ────────────────────────────────────────────────── */
  .brand {
    text-align: center;
    margin-top: 4px;
    position: relative; z-index: 2;
  }
  .brand .wordmark {
    font-family: var(--font-mark);
    font-size: 56px;
    line-height: 1;
    color: var(--gold-warm);
    letter-spacing: .04em;
    text-shadow: 0 2px 18px rgba(201,161,74,.35);
  }
  .brand .subline {
    font-family: var(--font-display);
    font-size: 9.5px;
    letter-spacing: .42em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-top: 10px;
  }
  .brand .greeting {
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    margin-top: 18px;
    opacity: .85;
  }
  .brand .greeting em { color: var(--gold-warm); font-style: italic; font-weight: 500; }

  /* ── Колонка карточек-входов ──────────────────────────────── */
  .entries {
    position: relative; z-index: 2;
    margin-top: 28px;
    display: flex; flex-direction: column; gap: 14px;
    flex: 1;
  }
  .entry {
    position: relative;
    display: grid;
    grid-template-columns: 78px 1fr auto;
    gap: 16px;
    align-items: center;
    padding: 14px 16px 14px 14px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.18)),
      linear-gradient(180deg, var(--bg-soft) 0%, #0a051b 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .35s ease, transform .35s ease;
    text-decoration: none;
    color: inherit;
  }
  .entry::before {
    /* Тонкая золотая «волосок-линия» — внутри границы */
    content: ""; position: absolute; inset: 1px;
    border-radius: 17px;
    border: 1px solid rgba(201,161,74,.05);
    pointer-events: none;
  }
  .entry:hover, .entry:active {
    border-color: var(--line-hot);
    transform: translateY(-1px);
  }
  .entry .thumb {
    width: 78px; height: 110px;
    border-radius: 8px;
    background: linear-gradient(155deg, #2b1746 0%, #0d0426 100%);
    border: 1px solid rgba(201,161,74,.35);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow:
      inset 0 0 0 1px rgba(201,161,74,.08),
      0 12px 22px -10px rgba(0,0,0,.7);
  }
  .entry .thumb::after {
    /* «отражение» сверху */
    content: ""; position: absolute; left: 4px; right: 4px; top: 4px; height: 24px;
    background: linear-gradient(180deg, rgba(255,236,180,.10), transparent);
    border-radius: 4px;
    pointer-events: none;
  }
  .entry .thumb .glyph {
    font-family: var(--font-display);
    font-size: 22px;
    color: var(--gold-warm);
    letter-spacing: .04em;
  }
  .entry .thumb.moon-thumb .glyph {
    font-family: var(--font-mark);
    font-size: 32px;
  }
  .entry .text .kicker {
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: .28em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .entry .text .title {
    font-family: var(--font-display);
    font-size: 19px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: .03em;
  }
  .entry .text .whisper {
    font-style: italic;
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 4px;
    line-height: 1.35;
  }
  .entry .arrow {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold);
    font-size: 14px;
    transition: border-color .35s ease, transform .35s ease;
  }
  .entry:hover .arrow { border-color: var(--line-hot); transform: translateX(2px); }

  /* «Первая среди равных» — расклад. Чуть крупнее. */
  .entry.primary {
    background:
      linear-gradient(135deg, rgba(201,161,74,.10) 0%, rgba(201,161,74,0) 60%),
      linear-gradient(180deg, #1a0d2e 0%, #0a051b 100%);
  }
  .entry.primary .title { font-size: 21px; }
  .entry.primary .thumb {
    background: linear-gradient(155deg, #3a1f54 0%, #0d0426 100%);
    border-color: rgba(201,161,74,.5);
  }

  /* ── Низ: микро-навигация (скрытая, едва намёк) ───────────── */
  .micro-nav {
    position: relative; z-index: 2;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .micro-nav .item {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-display);
    font-size: 9px;
    letter-spacing: .25em;
    color: var(--ink-faint);
    text-transform: uppercase;
    background: none; border: none;
    cursor: pointer;
    transition: color .25s ease;
  }
  .micro-nav .item:hover { color: var(--gold); }
  .micro-nav .dotmark {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-faint);
  }
  .micro-nav .item:hover .dotmark { background: var(--gold); }

  /* ── Орнаментальные разделители (тонкие штрихи между картами) ─ */
  .divider {
    margin: 24px auto 4px;
    width: 60%;
    text-align: center;
    color: var(--ink-faint);
    letter-spacing: .8em;
    font-size: 10px;
  }
  .divider::before, .divider::after {
    content: "";
    display: inline-block;
    width: 28px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    vertical-align: middle;
    margin: 0 8px;
  }

  /* fade-in stagger при загрузке */
  .reveal { opacity: 0; transform: translateY(8px); animation: reveal .9s ease forwards; }
  .reveal:nth-child(1) { animation-delay: .05s; }
  .reveal:nth-child(2) { animation-delay: .15s; }
  .reveal:nth-child(3) { animation-delay: .28s; }
  .reveal:nth-child(4) { animation-delay: .42s; }
  .reveal:nth-child(5) { animation-delay: .55s; }
  @keyframes reveal { to { opacity: 1; transform: none; } }

</style>
</head>
<body>
  <div class="device">
    <div class="stars" aria-hidden="true"></div>

    <header class="top reveal">
      <div class="moon-phase"><span class="dot"></span>Луна растёт · 16 мая</div>
      <div>Luna · I.0</div>
    </header>

    <div class="moon-stage reveal" aria-hidden="true">
      <div class="moon-aura"></div>
      <div class="orbit"></div>
      <div class="moon"></div>
    </div>

    <div class="brand reveal">
      <div class="wordmark">Luna</div>
      <div class="subline">Зеркало Таро</div>
      <p class="greeting">Здравствуй, <em>Игорь</em>. О чём твоё сердце сегодня?</p>
    </div>

    <div class="divider reveal">✦</div>

    <nav class="entries">
      <a href="#" class="entry primary reveal" aria-label="Расклад на вопрос">
        <div class="thumb"><span class="glyph">III</span></div>
        <div class="text">
          <div class="kicker">Открыть путь</div>
          <div class="title">Расклад на вопрос</div>
          <div class="whisper">три карты — прошлое, настоящее, грядущее</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <a href="#" class="entry reveal" aria-label="Карта дня">
        <div class="thumb moon-thumb"><span class="glyph">L</span></div>
        <div class="text">
          <div class="kicker">Сегодня</div>
          <div class="title">Карта дня</div>
          <div class="whisper">луна уже выбрала её для тебя</div>
        </div>
        <div class="arrow">→</div>
      </a>

      <a href="#" class="entry reveal" aria-label="Дневник раскладов">
        <div class="thumb"><span class="glyph">✦</span></div>
        <div class="text">
          <div class="kicker">Память</div>
          <div class="title">Дневник Луны</div>
          <div class="whisper">расклады, что уже звучали</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </nav>

    <footer class="micro-nav reveal">
      <button class="item" type="button"><span class="dotmark"></span>Звук</button>
      <button class="item" type="button"><span class="dotmark"></span>Профиль</button>
      <button class="item" type="button"><span class="dotmark"></span>Помощь</button>
    </footer>
  </div>
</body>
</html>
