# Production stack для Luna Tarot.
# Отличия от docker-compose.yml (dev):
#   1. НИКТО НЕ ПУБЛИКУЕТ порты наружу, кроме Caddy (80/443).
#      postgres / backend / landing доступны только внутри docker-сети.
#   2. Добавлен Caddy reverse proxy с auto-HTTPS через Let's Encrypt.
#   3. Все секреты — через .env (никаких дефолтов).
#
# Запуск:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Обновление кода:
#   git pull && docker compose -f docker-compose.prod.yml up -d --build backend

services:
  caddy:
    # Кастомный Caddy с DuckDNS DNS-плагином (см. caddy/Dockerfile).
    # Нужен для DNS-01 ACME challenge — иначе Let's Encrypt не может
    # верифицировать lunatarot-kuma.duckdns.org из-за нестабильных
    # DuckDNS secondary nameservers.
    build:
      context: ./caddy
      dockerfile: Dockerfile
    image: luna-caddy:duckdns
    container_name: luna-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      LUNA_DOMAIN: ${LUNA_DOMAIN:?LUNA_DOMAIN не задан в .env}
      LUNA_KUMA_DOMAIN: ${LUNA_KUMA_DOMAIN:?LUNA_KUMA_DOMAIN не задан в .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN не задан в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - landing
      - kuma

  postgres:
    image: postgres:16-alpine
    container_name: luna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
    volumes:
      - luna_pgdata:/var/lib/postgresql/data
    # Порт НЕ публикуем — postgres доступен только внутри сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luna-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:?TG_BOT_TOKEN не задан}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:?TG_BOT_USERNAME не задан}
      TG_MINI_APP_URL: ${TG_MINI_APP_URL:?TG_MINI_APP_URL не задан}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # Порт НЕ публикуем — Caddy ходит по docker-сети

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: luna-landing
    restart: unless-stopped
    # Порт НЕ публикуем — Caddy ходит по docker-сети

  # Uptime Kuma — мониторит health-эндпоинты и шлёт алерты в Telegram при падении.
  # ~80 MB RAM, sqlite в волюме. Через Caddy на отдельном поддомене с HTTPS.
  kuma:
    image: louislam/uptime-kuma:1
    container_name: luna-kuma
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    # Порт НЕ публикуем — Caddy ходит по docker-сети

volumes:
  luna_pgdata:
  caddy_data:     # сертификаты Let's Encrypt живут тут — НЕ удалять
  caddy_config:
  kuma_data:      # конфиг Kuma + sqlite база мониторов — НЕ удалять
