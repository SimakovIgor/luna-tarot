services:
  caddy:
    image: luna-caddy:duckdns
    container_name: luna-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LUNA_DOMAIN: ${LUNA_DOMAIN:?LUNA_DOMAIN не задан в .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DUCKDNS_TOKEN не задан в .env}
    volumes:
      - ./Caddyfile.slim:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    mem_limit: 96m

  postgres:
    image: postgres:16-alpine
    container_name: luna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    volumes:
      - luna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 224m

  backend:
    image: luna-backend:local
    container_name: luna-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      TG_BOT_ENABLED: ${TG_BOT_ENABLED:-true}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:?TG_BOT_TOKEN не задан}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:?TG_BOT_USERNAME не задан}
      TG_MINI_APP_URL: ${TG_MINI_APP_URL:?TG_MINI_APP_URL не задан}
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    mem_limit: 512m

volumes:
  luna_pgdata:
  caddy_data:
  caddy_config:
